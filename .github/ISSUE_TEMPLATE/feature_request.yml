name: Scientific or software enhancement
description: Propose a focused, verifiable extension
title: "[Enhancement]: "
labels: [enhancement]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Scientific motivation
      description: What question or workflow would this enable?
    validations:
      required: true
  - type: textarea
    id: formulation
    attributes:
      label: Proposed formulation or interface
      description: Link primary references and identify governing equations.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: State benchmarks, invariants, error measures, and acceptance criteria.
    validations:
      required: true
